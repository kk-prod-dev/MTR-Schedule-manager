<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>GeoRail</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0f1115;
    color: #e5e7eb;
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px;
  }
  .logo {
    width: 92px; height: 92px;
    border-radius: 22px;
    background: linear-gradient(135deg, #6366f1, #38bdf8);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 50px rgba(99, 102, 241, .35);
  }
  .logo svg { width: 52px; height: 52px; }
  .title { font-size: 22px; font-weight: 650; letter-spacing: .3px; }
  .sub { font-size: 13px; color: #9ca3af; margin-top: -14px; }
  .bar {
    width: 220px; height: 4px; border-radius: 4px;
    background: #1d212b; overflow: hidden; position: relative;
  }
  .bar::after {
    content: ""; position: absolute; inset: 0;
    width: 40%; border-radius: 4px;
    background: linear-gradient(90deg, #6366f1, #38bdf8);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  /* Новый интерфейс (?layout=next): заставка из макета Claude Design */
  @font-face { font-family: "DM Sans"; font-weight: 500; src: url(../public/vendor/fonts/dm-sans-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+2000-206F; }
  @font-face { font-family: "DM Sans"; font-weight: 500; src: url(../public/vendor/fonts/manrope-cyrillic-500-normal.woff2) format("woff2"); unicode-range: U+0400-045F; }
  @font-face { font-family: "DM Mono"; font-weight: 400; src: url(../public/vendor/fonts/dm-mono-latin-400-normal.woff2) format("woff2"); }
  .next-splash { display: none; }
  .next body { background: #0B0B0E; color: #FBE5DC; font-family: "DM Sans", system-ui, sans-serif; }
  .next .wrap { display: none; }
  .next .next-splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; position: relative; }
  .next .next-splash svg { width: 88px; height: 88px; }
  .next .ns-title { font-size: 14px; font-weight: 500; margin-top: 18px; }
  .next .ns-sub { font-size: 12px; color: #A0928E; margin-top: 6px; }
  .next .ns-ver { position: absolute; left: 28px; bottom: 42px; font: 11px "DM Mono", monospace; color: #A0928E; }
  .next .ns-bar { position: absolute; left: 28px; right: 28px; bottom: 30px; height: 4px; border-radius: 2px; background: #1E1D24; overflow: hidden; }
  .next .ns-bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 38%; border-radius: 2px; background: #FBE5DC; animation: slide 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .next .ns-bar::after { animation: none; left: 0; } }
</style>
<script>
  if (new URLSearchParams(location.search).get("layout") === "next") document.documentElement.classList.add("next");
</script>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="3" width="14" height="14" rx="3"/>
        <path d="M5 11h14"/>
        <circle cx="8.5" cy="14" r="1"/>
        <circle cx="15.5" cy="14" r="1"/>
        <path d="M8 17l-2 4M16 17l2 4"/>
      </svg>
    </div>
    <div style="text-align:center">
      <div class="title">GeoRail</div>
      <div class="sub">запуск сервера расписания…</div>
    </div>
    <div class="bar"></div>
  </div>
  <div class="next-splash">
    <svg viewBox="120 123 266 266" role="img" aria-label="Schedule Manager"><path fill="#FBE5DC" d="M327.558 131C336.068 131 343.947 135.316 348.399 142.364L348.819 143.054L378 192.903L341.026 213.605L317.061 172.667H259.167L359.961 345.154C369.295 361.126 357.502 381 338.691 381H239.373C230.589 381 222.477 376.401 218.113 368.946L181.225 305.934L218.2 285.233L249.871 339.333H307.488L210.095 172.667H190.547L164.974 216.352L128 195.648L158.789 143.054L159.209 142.364C163.661 135.316 171.54 131 180.049 131H327.558Z"/></svg>
    <div class="ns-title">Поднимаем пантограф…</div>
    <div class="ns-sub">Запускаем сервер расписания</div>
    <div class="ns-ver" id="nsVer"></div>
    <div class="ns-bar" role="progressbar" aria-label="Загрузка"></div>
  </div>
  <script>
    var v = new URLSearchParams(location.search).get("v");
    if (v && /^[0-9A-Za-z.\-]{1,32}$/.test(v)) document.getElementById("nsVer").textContent = "v" + v;
  </script>
</body>
</html>
