# Сборка дистрибутивов Linux (AppImage) и macOS (DMG).
# Windows-установщик собирается локально (npm run build) — здесь только те
# платформы, которые невозможно собрать на Windows-машине.
#
# Запуск:
#  - вручную со страницы Actions (workflow_dispatch) — артефакты появятся
#    в результатах запуска;
#  - при пуше тега v* (например v1.1.0) — файлы дополнительно прикрепятся
#    к GitHub Release этого тега (electron-builder --publish).
name: Build Linux & macOS dist

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# electron-builder --publish создаёт/дополняет GitHub Release —
# дефолтному GITHUB_TOKEN нужны права на запись содержимого репозитория
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # На теге публикуем в релиз, на ручном запуске — только собираем
        run: npx electron-builder --linux --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13     # Intel x64
            arch: x64
          - runner: macos-latest # Apple Silicon arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build DMG (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # artifactName переопределяем с суффиксом архитектуры, иначе x64 и
        # arm64 DMG получили бы одинаковое имя и перезаписали друг друга
        run: >
          npx electron-builder --mac --${{ matrix.arch }}
          -c.mac.artifactName='MTRScheduleManager-${version}-${arch}.${ext}'
          --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error
