# Сборка дистрибутивов для Windows, macOS и Linux.
#
# Запускается:
#  - на каждый коммит в main — артефакты доступны в результатах запуска;
#  - при пуше тега v* (например v1.1.0) — дистрибутивы дополнительно
#    прикрепляются к GitHub Release этого тега (electron-builder --publish);
#  - вручную со страницы Actions (workflow_dispatch).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет ещё идущую сборку предыдущего коммита
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# electron-builder --publish создаёт/дополняет GitHub Release —
# дефолтному GITHUB_TOKEN нужны права на запись содержимого репозитория
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build NSIS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # На теге публикуем в релиз, на обычном коммите — только собираем
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13     # Intel x64
            arch: x64
          - runner: macos-latest # Apple Silicon arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build DMG (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # artifactName переопределяем с суффиксом архитектуры, иначе x64 и
        # arm64 DMG получили бы одинаковое имя и перезаписали друг друга
        run: >
          npx electron-builder --mac --${{ matrix.arch }}
          -c.mac.artifactName='MTRScheduleManager-${version}-${arch}.${ext}'
          --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error
